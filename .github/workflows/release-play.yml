name: Release to Google Play

# Wraps the live PWA (deployed by deploy-pages.yml) into a signed Android App Bundle using
# Bubblewrap (Trusted Web Activity) and uploads it to the Play Console via the Play Developer API.
# Manual only: publishing to Play Store is not something that should happen on every push.
on:
  workflow_dispatch:
    inputs:
      track:
        description: Play Console track to publish to
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
        default: internal
      versionName:
        description: 'App version name shown to users, e.g. 1.0.0'
        type: string
        required: true
      versionCode:
        description: 'App version code (integer, must be higher than any previous upload). Leave blank to auto-use the workflow run number.'
        type: string
        required: false

# Only one Play release at a time.
concurrency:
  group: release-play
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli@1.25.0

      # Pre-seeding ~/.bubblewrap/config.json is what makes every subsequent `bubblewrap` command
      # non-interactive: the CLI otherwise prompts "install JDK?" / "install Android SDK?" on its
      # very first run of any command (including --help), which would hang forever in CI.
      - name: Configure Bubblewrap (non-interactive)
        run: |
          mkdir -p "$HOME/.bubblewrap"
          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {"jdkPath": "$JAVA_HOME", "androidSdkPath": "$ANDROID_HOME"}
          EOF

      - name: Decode signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/android.keystore

      - name: Determine version code
        id: ver
        run: |
          if [ -n "${{ inputs.versionCode }}" ]; then
            echo "code=${{ inputs.versionCode }}" >> "$GITHUB_OUTPUT"
          else
            echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set app version in twa-manifest.json
        env:
          VERSION_NAME: ${{ inputs.versionName }}
          VERSION_CODE: ${{ steps.ver.outputs.code }}
        run: |
          node -e "
            const fs = require('fs');
            const path = 'android/twa-manifest.json';
            const m = JSON.parse(fs.readFileSync(path, 'utf8'));
            m.appVersion = process.env.VERSION_NAME;
            m.appVersionCode = parseInt(process.env.VERSION_CODE, 10);
            fs.writeFileSync(path, JSON.stringify(m, null, 2));
          "

      # Regenerates the full Android/Gradle project from twa-manifest.json. --skipVersionUpgrade
      # is what keeps this non-interactive (it also skips writing back to twa-manifest.json).
      - name: Generate TWA Android project
        working-directory: android
        run: bubblewrap update --skipVersionUpgrade

      - name: Build signed App Bundle
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bubblewrap build

      - name: Upload App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: nodebreaker-release-${{ steps.ver.outputs.code }}
          path: android/app-release-bundle.aab

      - name: Decode Play service account
        run: echo '${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}' > "$RUNNER_TEMP/play-service-account.json"

      - name: Publish to Play Console
        working-directory: android
        run: bubblewrap play publish --track ${{ inputs.track }} --serviceAccountFile "$RUNNER_TEMP/play-service-account.json"

      - name: Clean up secrets from workspace
        if: always()
        run: rm -f android/android.keystore "$RUNNER_TEMP/play-service-account.json"
